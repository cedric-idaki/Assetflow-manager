
# Password policy — mirrors PASSWORD_POLICY in src/utils/validation.js and the
# check in functions/create-staff-user. Enforced by Supabase Auth (GoTrue) on
# signUp / updateUser, so the policy holds even for direct API calls.
#
# NOTE: `supabase config push` resets any [auth] key NOT declared here to the
# CLI default. The keys below (site_url, redirects, MFA, email OTP) are pinned
# to the live project's values so a push only changes the password policy.
[auth]
site_url = "http://localhost:4028"
additional_redirect_urls = ["http://localhost:4028/reset-password"]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 86400

[functions.create-staff-user]
enabled = true
verify_jwt = true
import_map = "./functions/create-staff-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-staff-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-staff-user/*.html" ]

# The auto-close worker (elections + motions). Invoked by the scheduler with the
# service-role key, so no user JWT — verify_jwt must be false. sacco_governance_
# run_due is granted to service_role only, so this stays system-authority.
[functions.sacco-governance-tick]
enabled = true
verify_jwt = false
entrypoint = "./functions/sacco-governance-tick/index.ts"

# Sales-agent follow-up reminders. Invoked by the scheduler with the service-role
# key (no user JWT), so verify_jwt must be false — same shape as
# sacco-governance-tick. Run it every ~15 minutes.
[functions.agent-followup-reminders]
enabled = true
verify_jwt = false
entrypoint = "./functions/agent-followup-reminders/index.ts"

# E-signature auto-reminders + link expiry. Invoked by the scheduler with the
# service-role key (no user JWT), so verify_jwt must be false — same shape as
# agent-followup-reminders. Run it every ~6 hours.
[functions.esign-reminders]
enabled = true
verify_jwt = false
entrypoint = "./functions/esign-reminders/index.ts"

# Website → Ararat vehicle sync. Authenticated by a per-dealer API key in the
# x-api-key header (not a Supabase JWT), so verify_jwt MUST be false — the caller
# is the dealer's website, not a logged-in user. The function resolves the tenant
# from the key hash and upserts into public.assets with the service-role key.
[functions.ingest-assets]
enabled = true
verify_jwt = false
entrypoint = "./functions/ingest-assets/index.ts"

# M-Pesa Daraja callback. Safaricom POSTs the STK result here with NO auth header
# of any kind, so verify_jwt MUST be false — otherwise every callback is rejected
# with 401 and payments never get confirmed. The function trusts nothing from the
# body: it looks the CheckoutRequestID up in mpesa_transactions (which we created)
# and ignores callbacks that do not match a request we initiated.
[functions.mpesa-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/mpesa-callback/index.ts"

# STK push initiator. Called from the app by a signed-in user, so verify_jwt stays
# true — the caller's JWT is what scopes the payment to their tenant.
[functions.mpesa-stk-push]
enabled = true
verify_jwt = true
entrypoint = "./functions/mpesa-stk-push/index.ts"

# M-Pesa configuration status. Super-admin only, enforced inside the function
# against user_profiles.role; verify_jwt stays true so an unauthenticated caller
# never reaches that check.
[functions.mpesa-config]
enabled = true
verify_jwt = true
entrypoint = "./functions/mpesa-config/index.ts"

# Tenant M-Pesa credentials (flow 2 — a company/sacco collecting into its OWN
# paybill). The caller's JWT is what decides whose credentials these are, so
# verify_jwt MUST stay true; admin_id is never read from the request body. The
# function is the only write path to mpesa_tenant_credentials, which has RLS on
# with zero policies.
[functions.mpesa-credentials]
enabled = true
verify_jwt = true
entrypoint = "./functions/mpesa-credentials/index.ts"

# E-signature API & embedded signing. Authenticated by a per-tenant API key in
# the x-api-key header (not a Supabase JWT), so verify_jwt MUST be false — the
# caller is the client team's own server/app. The function resolves the tenant
# from the key hash (esign_api_keys) and writes with the service-role key.
[functions.esign-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/esign-api/index.ts"
