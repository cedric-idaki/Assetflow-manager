<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c2037" />
  <title>You're offline — Ararat</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
      background: radial-gradient(120% 120% at 50% 0%, #1a3a5c 0%, #0c2037 55%, #081726 100%);
      color: #e8eef6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    .card { max-width: 24rem; }

    img { width: 84px; height: 84px; margin-bottom: 1.75rem; }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 2rem;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #9fb3c8;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 0.8rem 2rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      color: #052430;
      background: #34c1dd;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.88; }
    button:active { opacity: 0.75; }

    button:focus-visible { outline: 2px solid #7fe3f5; outline-offset: 3px; }

    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64798f;
      min-height: 1.2em;
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="/icons/icon.svg" alt="" />
    <h1>No internet connection</h1>
    <p>
      Ararat needs a connection to reach your records. Check your mobile data or
      Wi-Fi, then try again.
    </p>
    <button type="button" id="retry">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    var retry = document.getElementById('retry');
    var status = document.getElementById('status');

    retry.addEventListener('click', function () {
      status.textContent = 'Reconnecting…';
      location.reload();
    });

    // Reload by itself the moment connectivity comes back, so the user does not
    // have to notice and tap.
    window.addEventListener('online', function () {
      status.textContent = 'Back online — reloading…';
      location.reload();
    });
  </script>
</body>

</html>
