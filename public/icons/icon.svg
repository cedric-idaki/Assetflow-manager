<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ararat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122c4a"/>
      <stop offset="0.55" stop-color="#0c2037"/>
      <stop offset="1" stop-color="#081726"/>
    </linearGradient>
    <!-- userSpaceOnUse, not the default objectBoundingBox: the crossbar is a
         perfectly horizontal line, so its bounding box has zero height, and the
         SVG spec says an element referencing an objectBoundingBox gradient with
         a zero-height box is not rendered at all. It also keeps one continuous
         gradient across both strokes instead of restarting on each. -->
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="140" y1="130" x2="380" y2="400">
      <stop offset="0" stop-color="#5fd8ef"/>
      <stop offset="1" stop-color="#34c1dd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 390 L256 138 L384 390" stroke-width="54"/>
    <path d="M186 316 H326" stroke-width="46"/>
  </g>
</svg>
